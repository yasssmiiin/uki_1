<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Основы CSS</title>
    <style>
      /* идентификатор */
      #paragraph {
        color: blueviolet;
      }
      /* класс */
      .text {
        color: #f00;
      }
      /* тег */
      p {
        color: rgb(10, 45, 200);
        width: 200px;
        height: 200px;
      }
    </style>
  </head>

    <p class="text" id="paragraph_1">
      Селектор по тегу находит элемент на странице по имени тега.
    </p>
    <p class="text" id="paragraph_2">
